name: Sync Notion posts (read-only)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * *"  # KST 09:00

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Export Notion DB to _posts/notion
        env:
          NOTION_AUTH_TOKEN: ${{ secrets.NOTION_AUTH_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/sync_notion_posts.mjs

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          add: "_posts/notion"
          message: "chore: sync posts from notion"
